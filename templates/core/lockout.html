<!DOCTYPE html>
{% load static %}
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Bloqueado - Nexus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="{% static 'img/favicon.png' %}">
    <style>
        :root {
            --aa-indigo: #4f46e5;
            --aa-slate-400: #94a3b8;
            --aa-slate-500: #64748b;
            --aa-slate-900: #0f172a;
        }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--aa-slate-900);
            color: #fff;
            position: relative;
            overflow: hidden;
            margin: 0;
            padding: 2rem;
        }
        body::before {
            content: '';
            position: absolute; inset: 0;
            background-image: radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            opacity: 0.8;
            z-index: 0;
        }
        .glow {
            position: absolute;
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(239, 68, 68, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(50px);
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
        }
        .lockout-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 3rem 2rem;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }
        .lock-icon-wrap {
            width: 80px; height: 80px;
            margin: 0 auto 1.5rem;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.25);
            border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
            color: #ef4444;
            font-size: 2.25rem;
            box-shadow: 0 10px 25px rgba(239, 68, 68, 0.15);
        }
        .lockout-title {
            font-size: 1.5rem; font-weight: 800;
            margin-bottom: 0.75rem; letter-spacing: -0.01em;
        }
        .lockout-text {
            color: var(--aa-slate-400);
            font-size: 0.95rem; line-height: 1.6;
            margin-bottom: 2rem;
        }
        .btn-back {
            display: inline-flex; align-items: center; gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            color: #fff; text-decoration: none;
            font-weight: 600; font-size: 0.9rem;
            transition: all 0.2s;
        }
        .btn-back:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.15);
            transform: translateY(-1px);
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="glow"></div>
    <div class="lockout-card">
        <div class="lock-icon-wrap">
            <i class="bi bi-shield-slash"></i>
        </div>
        <h2 class="lockout-title">Acesso Bloqueado Temporariamente</h2>
        <p class="lockout-text">
            Detectamos muitas tentativas de login malsucedidas. Por motivos de segurança, esta sessão foi temporariamente suspensa.<br><br>
            Tente novamente mais tarde ou entre em contato com a administração.
        </p>
        <a href="/login/" class="btn-back">
            <i class="bi bi-arrow-left"></i> Voltar para o Login
        </a>
    </div>
</body>
</html>
