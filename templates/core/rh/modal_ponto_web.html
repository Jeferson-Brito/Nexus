<!-- Modal Ponto Web -->
<div class="modal fade" id="modalPontoWeb" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
    <div class="modal-dialog modal-dialog-centered" style="max-width: 400px;">
        <div class="modal-content border-0 rounded-4 shadow-lg overflow-hidden">
            
            <!-- Header -->
            <div class="modal-header border-0 bg-primary text-white py-3 px-4">
                <div>
                    <h5 class="modal-title fw-bold mb-0">Registro de Ponto</h5>
                    <small class="opacity-75" id="pontoWebDate">Carregando data...</small>
                </div>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"
                        onclick="stopWebCam()"></button>
            </div>

            <div class="modal-body p-4 text-center pb-2">
                
                <!-- Relógio Principal -->
                <div class="display-3 fw-bold text-dark mb-1 font-monospace" id="pontoWebClock" style="letter-spacing: -2px;">
                    00:00:00
                </div>
                <p class="text-muted small mb-4">
                    <i class="bi bi-geo-alt-fill me-1 text-primary"></i> 
                    Localização via Web
                </p>

                {% if request.user.colaborador_perfil.ponto_web_foto %}
                <!-- Área da Câmera -->
                <div class="mx-auto bg-light rounded-3 overflow-hidden position-relative mb-4 border" 
                     style="width: 200px; height: 200px; display: none;" id="webCamContainer">
                     <video id="webCamVideo" autoplay playsinline style="width: 100%; height: 100%; object-fit: cover;"></video>
                     <div class="position-absolute w-100 h-100 top-0 start-0 d-flex align-items-center justify-content-center text-muted" id="webCamLoading">
                         <div class="spinner-border spinner-border-sm me-2"></div> Câmera...
                     </div>
                </div>
                <!-- Canvas Oculto para capturar -->
                <canvas id="webCamCanvas" class="d-none"></canvas>
                {% endif %}

                <!-- Mensagens de Erro/Sucesso -->
                <div id="pontoWebAlert" class="alert d-none small text-start mb-3"></div>

                <!-- Botões de Ação -->
                <div class="d-grid gap-2 mb-2">
                    <button class="btn btn-outline-primary fw-semibold py-2 d-flex align-items-center justify-content-center gap-2 btn-batida" data-tipo="entrada">
                        <i class="bi bi-box-arrow-in-right fs-5"></i> Entrada
                    </button>
                    
                    <div class="d-flex gap-2">
                        <button class="btn btn-outline-secondary fw-semibold py-2 w-50 d-flex align-items-center justify-content-center gap-1 btn-batida" data-tipo="saida_almoco">
                            <i class="bi bi-cup-hot"></i> Intervalo
                        </button>
                        <button class="btn btn-outline-secondary fw-semibold py-2 w-50 d-flex align-items-center justify-content-center gap-1 btn-batida" data-tipo="retorno_almoco">
                            <i class="bi bi-person-check"></i> Retorno
                        </button>
                    </div>

                    <button class="btn btn-outline-dark fw-semibold py-2 d-flex align-items-center justify-content-center gap-2 mt-1 btn-batida" data-tipo="saida">
                        <i class="bi bi-box-arrow-right fs-5"></i> Saída
                    </button>
                </div>

            </div>

            <div class="modal-footer border-0 p-3 pt-0 justify-content-center">
                <small class="text-muted" style="font-size: 0.70rem;">
                    O ponto é registrado usando o horário oficial do servidor.
                </small>
            </div>
            
        </div>
    </div>
</div>

<script>
    let webCamStream = null;
    const exigeFoto = "{{ request.user.colaborador_perfil.ponto_web_foto|yesno:'true,false' }}" === "true";
    const colaboradorId = "{{ request.user.colaborador_perfil.id|default:'' }}";

    // Atualização do Relógio
    function updatePontoWebClock() {
        const now = new Date();
        document.getElementById('pontoWebClock').textContent = now.toLocaleTimeString('pt-BR');
        
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        let dateStr = now.toLocaleDateString('pt-BR', options);
        // Capitalizar primeira letra
        dateStr = dateStr.charAt(0).toUpperCase() + dateStr.slice(1);
        document.getElementById('pontoWebDate').textContent = dateStr;
    }

    // Inicialização ao Abrir o Modal
    document.getElementById('modalPontoWeb')?.addEventListener('show.bs.modal', function () {
        updatePontoWebClock();
        window.pontoWebInterval = setInterval(updatePontoWebClock, 1000);
        document.getElementById('pontoWebAlert').classList.add('d-none');
        
        // Habilitar botões
        document.querySelectorAll('.btn-batida').forEach(b => {
             b.disabled = false;
             // Reset spinner
             const icon = b.dataset.originalIcon;
             if(icon) b.innerHTML = icon;
        });

        // Iniciar Câmera se exigido
        if (exigeFoto) {
            const container = document.getElementById('webCamContainer');
            const video = document.getElementById('webCamVideo');
            const loading = document.getElementById('webCamLoading');
            container.style.display = 'block';
            loading.style.display = 'flex';
            
            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } })
                .then(stream => {
                    webCamStream = stream;
                    video.srcObject = stream;
                    video.onloadedmetadata = () => loading.style.display = 'none';
                })
                .catch(err => {
                    showAlert('Não foi possível acessar a câmera. Permita o uso da câmera para bater o ponto.', 'danger');
                    loading.style.display = 'none';
                });
        }
    });

    // Limpeza ao Fechar o Modal
    document.getElementById('modalPontoWeb')?.addEventListener('hide.bs.modal', function () {
        clearInterval(window.pontoWebInterval);
        stopWebCam();
    });

    function stopWebCam() {
        if (webCamStream) {
            webCamStream.getTracks().forEach(track => track.stop());
            webCamStream = null;
        }
    }

    function showAlert(msg, type='success') {
        const alertBox = document.getElementById('pontoWebAlert');
        alertBox.className = `alert alert-${type} small text-start mb-3`;
        alertBox.innerHTML = msg;
    }

    // Capture Base64 from Video
    function getPhotoBase64() {
        return new Promise((resolve) => {
            if (!exigeFoto || !webCamStream) {
                resolve("");
                return;
            }
            const video = document.getElementById('webCamVideo');
            const canvas = document.getElementById('webCamCanvas');
            // Dimensionar canvas igual ao vídeo real
            canvas.width = video.videoWidth || 480;
            canvas.height = video.videoHeight || 640;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL('image/jpeg', 0.8));
        });
    }

    // Ação de Bater o Ponto
    document.querySelectorAll('.btn-batida').forEach(btn => {
        btn.addEventListener('click', async function() {
            if (!colaboradorId) {
                showAlert('Erro: Seu perfil não está vinculado a um Colaborador válido.', 'danger');
                return;
            }
            
            if (exigeFoto && !webCamStream) {
                showAlert('A câmera precisa ser permitida e estar funcionando.', 'danger');
                return;
            }

            const tipo = this.dataset.tipo;
            
            // Disabilitar todos os botões temporariamente
            document.querySelectorAll('.btn-batida').forEach(b => b.disabled = true);
            this.dataset.originalIcon = this.innerHTML;
            this.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Registrando...';

            const photoBase64 = await getPhotoBase64();

            fetch('/api/ponto/registrar/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    colaborador_id: colaboradorId,
                    tipo: tipo,
                    foto_base64: photoBase64,
                    origem: 'web'
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.sucesso || data.id) {
                    showAlert(data.mensagem || 'Ponto registrado com sucesso!', 'success');
                    setTimeout(() => {
                        const modalEl = document.getElementById('modalPontoWeb');
                        bootstrap.Modal.getInstance(modalEl)?.hide();
                        
                        // Opcional: toast ou SweetAlert de sucesso na tela principal
                        if(typeof Swal !== 'undefined') {
                            Swal.fire({
                                icon: 'success',
                                title: 'Marcação feita!',
                                text: data.mensagem,
                                timer: 3000,
                                showConfirmButton: false
                            });
                        }
                    }, 1500);
                } else if (data.erro) {
                    showAlert(data.erro, 'danger');
                    // Reativa os botões em caso de erro (ex: duplo registro)
                    document.querySelectorAll('.btn-batida').forEach(b => b.disabled = false);
                    this.innerHTML = this.dataset.originalIcon;
                }
            })
            .catch(err => {
                showAlert('Erro de conexão ao servidor. Tente novamente.', 'danger');
                document.querySelectorAll('.btn-batida').forEach(b => b.disabled = false);
                this.innerHTML = this.dataset.originalIcon;
            });
        });
    });
</script>
