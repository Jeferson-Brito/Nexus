{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container-fluid py-4">

    <!-- Painel principal -->
    <div class="card border-0 shadow-sm" style="border-radius: 12px; overflow: hidden;">
        <!-- Header do painel -->
        <div class="card-header bg-white border-bottom d-flex align-items-center justify-content-between py-3 px-4">
            <h5 class="fw-bold mb-0 text-dark">Funcionários</h5>
            <div class="d-flex gap-2">
                <button class="btn btn-primary d-flex align-items-center gap-2" data-bs-toggle="modal"
                    data-bs-target="#modalColaborador">
                    <i class="bi bi-plus-lg"></i> Adicionar
                </button>
                <div class="dropdown">
                    <button class="btn btn-outline-secondary" data-bs-toggle="dropdown">
                        <i class="bi bi-three-dots"></i>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" href="#" id="btnExportCSV"><i class="bi bi-download me-2"></i>Exportar CSV</a></li>
                        <li><a class="dropdown-item" href="#" id="btnRefresh"><i class="bi bi-arrow-clockwise me-2"></i>Recarregar</a></li>
                    </ul>
                </div>
            </div>
        </div>

        <!-- Toolbar: mostrar + filtros + busca -->
        <div class="card-body border-bottom py-3 px-4">
            <div class="d-flex flex-wrap align-items-center gap-3">
                <!-- Mostrar X registros -->
                <div class="d-flex align-items-center gap-2 text-muted small">
                    Mostrar
                    <select id="perPageSelect" class="form-select form-select-sm" style="width: auto;">
                        <option value="10">10</option>
                        <option value="25">25</option>
                        <option value="50">50</option>
                        <option value="100">100</option>
                    </select>
                    registros
                </div>

                <!-- Filtro departamento -->
                <select id="filterDept" class="form-select form-select-sm" style="width: auto; min-width: 160px;">
                    <option value="">Todos Departamentos</option>
                </select>

                <!-- Filtro status -->
                <select id="filterStatus" class="form-select form-select-sm" style="width: auto;">
                    <option value="ativo">Ativos</option>
                    <option value="ferias">Em Férias</option>
                    <option value="afastado">Afastados</option>
                    <option value="desligado">Desligados</option>
                    <option value="todos">Todos</option>
                </select>

                <!-- Busca à direita -->
                <div class="ms-auto d-flex align-items-center gap-2">
                    <label class="text-muted small mb-0">Buscar:</label>
                    <input type="text" id="searchColaborador" class="form-control form-control-sm"
                        placeholder="Nome, cargo, CPF..." style="width: 220px;">
                </div>
            </div>
        </div>

        <!-- Tabela -->
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0" id="colaboradoresTable">
                <thead class="table-light">
                    <tr>
                        <th class="px-4 py-3" style="min-width: 200px;">
                            Nome
                            <i class="bi bi-arrow-down-up text-muted ms-1" style="font-size: 0.75rem;"></i>
                        </th>
                        <th class="py-3">Empresa</th>
                        <th class="py-3">Departamento</th>
                        <th class="py-3">Cargo</th>
                        <th class="py-3">Tempo de Casa</th>
                        <th class="py-3">Status</th>
                        <th class="py-3 text-end pe-4"></th>
                    </tr>
                </thead>
                <tbody id="colaboradoresTbody">
                    <tr>
                        <td colspan="7" class="text-center py-5 text-muted">
                            <div class="spinner-border spinner-border-sm me-2"></div> Carregando...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Footer: contagem + paginação -->
        <div class="card-footer bg-white border-top d-flex align-items-center justify-content-between py-3 px-4">
            <span class="text-muted small" id="paginacaoInfo">—</span>
            <nav>
                <ul class="pagination pagination-sm mb-0 gap-1" id="paginacaoControles"></ul>
            </nav>
        </div>
    </div>
</div>

<!-- Modal Cadastro/Edição -->
<div class="modal fade" id="modalColaborador" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content border shadow">
            <div class="modal-header bg-primary text-white border-0">
                <h5 class="modal-title fw-bold" id="modalTitle">Cadastrar Funcionário</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                    aria-label="Close"></button>
            </div>
            <form id="formColaborador" enctype="multipart/form-data">
                <div class="modal-body p-4">
                    <input type="hidden" name="id" id="colaboradorId">
                    <input type="hidden" name="user_id" id="colaboradorUserId" value="">

                    <div class="row g-3">
                        <div class="col-md-12 text-center mb-3">
                            <div class="position-relative d-inline-block">
                                <img id="previewFoto" src="{% static 'img/avatar_placeholder.png' %}"
                                    class="rounded-circle border"
                                    style="width: 120px; height: 120px; object-fit: cover;">
                                <label for="inputFoto"
                                    class="position-absolute bottom-0 end-0 btn btn-sm btn-primary rounded-circle p-1">
                                    <i class="bi bi-camera-fill"></i>
                                </label>
                                <input type="file" id="inputFoto" name="foto" class="d-none" accept="image/*">
                            </div>
                        </div>

                        <h6 class="fw-bold border-bottom pb-2">Dados Pessoais</h6>
                        <div class="col-md-8">
                            <label class="form-label small fw-bold">Nome Completo</label>
                            <input type="text" name="nome_completo" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small fw-bold">CPF</label>
                            <input type="text" name="cpf" class="form-control" placeholder="000.000.000-00" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small fw-bold">Data de Nascimento</label>
                            <input type="date" name="data_nascimento" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small fw-bold">RG</label>
                            <input type="text" name="rg" class="form-control">
                        </div>

                        <h6 class="fw-bold border-bottom pb-2 mt-4">Dados Contratuais</h6>
                        <div class="col-md-4">
                            <label class="form-label small fw-bold">Data de Admissão</label>
                            <input type="date" name="data_admissao" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small fw-bold">Departamento</label>
                            <select name="department_id" id="formDept" class="form-select" required></select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-bold">Cargo Atual</label>
                            <input type="text" name="cargo" id="formCargo" class="form-control"
                                placeholder="Ex: Analista de RH" required>
                        </div>
                        <div class="col-md-6" id="divCargoInicial">
                            <label class="form-label small fw-bold">Cargo Inicial (Admissão)</label>
                            <input type="text" name="cargo_inicial" class="form-control"
                                placeholder="Igual ao atual se vazio">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small fw-bold">Salário Atual</label>
                            <div class="input-group">
                                <span class="input-group-text border-end-0 bg-light">R$</span>
                                <input type="number" step="0.01" name="salario_atual" class="form-control" required>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small fw-bold">Tipo Contrato</label>
                            <select name="tipo_contrato" id="formTipoContrato" class="form-select"></select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small fw-bold">Status Inicial</label>
                            <select name="status" id="formStatus" class="form-select"></select>
                        </div>
                    </div>
                </div>
                <div class="modal-footer border-0 p-4">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary px-4">Salvar Cadastro</button>
                </div>
            </form>
        </div>
    </div>
</div>

<style>
    /* Badge de status */
    .status-badge {
        font-size: 0.72rem;
        padding: 3px 10px;
        border-radius: 20px;
        font-weight: 600;
        text-transform: capitalize;
        display: inline-block;
    }
    .badge-ativo    { background: #d1fae5; color: #065f46; }
    .badge-ferias   { background: #dbeafe; color: #1e40af; }
    .badge-afastado { background: #fef3c7; color: #92400e; }
    .badge-desligado{ background: #fee2e2; color: #991b1b; }
    .badge-sem-ficha{ background: #f3f4f6; color: #374151; }

    /* Botões de ação na linha */
    .btn-row-action {
        width: 32px; height: 32px;
        border-radius: 6px;
        border: 1px solid #e5e7eb;
        background: #fff;
        color: #6b7280;
        display: inline-flex; align-items: center; justify-content: center;
        cursor: pointer; transition: all 0.15s;
        font-size: 0.85rem;
        text-decoration: none;
    }
    .btn-row-action:hover { background: #f3f4f6; color: #2563eb; border-color: #2563eb; }
    .btn-row-action.danger:hover { background: #fee2e2; color: #dc2626; border-color: #dc2626; }

    /* Avatar miniatura */
    .avatar-mini {
        width: 36px; height: 36px;
        border-radius: 50%;
        object-fit: cover;
        border: 2px solid #e5e7eb;
    }

    /* Paginação */
    .pagination .page-item .page-link {
        border-radius: 8px !important;
        min-width: 32px; text-align: center;
        font-size: 0.85rem;
    }
    .pagination .page-item.active .page-link {
        background: #2563eb; border-color: #2563eb;
    }

    /* Linha da tabela */
    #colaboradoresTable tbody tr { cursor: default; }
    #colaboradoresTable thead th { font-size: 0.82rem; font-weight: 600; color: #374151; border-bottom: 1px solid #e5e7eb; }
</style>

<script>
document.addEventListener('DOMContentLoaded', function () {
    const tbody        = document.getElementById('colaboradoresTbody');
    const searchInput  = document.getElementById('searchColaborador');
    const filterDept   = document.getElementById('filterDept');
    const filterStatus = document.getElementById('filterStatus');
    const perPage      = document.getElementById('perPageSelect');
    const form         = document.getElementById('formColaborador');
    const inputFoto    = document.getElementById('inputFoto');
    const previewFoto  = document.getElementById('previewFoto');

    let currentPage    = 1;

    // ─── Auxiliares (departamentos, status, tipo_contrato) ───────────────────
    fetch('/api/rh/auxiliar/')
        .then(r => r.json())
        .then(data => {
            if (!data.success) return;
            (data.departments || []).forEach(dept => {
                const opt = `<option value="${dept.id}">${dept.name}</option>`;
                filterDept.innerHTML += opt;
                const fd = document.getElementById('formDept');
                if (fd) fd.innerHTML += opt;
            });
            Object.entries(data.status_choices || {}).forEach(([v, l]) => {
                const s = document.getElementById('formStatus');
                if (s) s.innerHTML += `<option value="${v}">${l}</option>`;
            });
            Object.entries(data.tipo_contrato_choices || {}).forEach(([v, l]) => {
                const s = document.getElementById('formTipoContrato');
                if (s) s.innerHTML += `<option value="${v}">${l}</option>`;
            });
        });

    // ─── Carregar colaboradores ───────────────────────────────────────────────
    function loadColaboradores() {
        currentPage = 1;
        const params = new URLSearchParams({
            status: filterStatus.value,
            department: filterDept.value
        });
        tbody.innerHTML = `<tr><td colspan="7" class="text-center py-4 text-muted">
            <div class="spinner-border spinner-border-sm me-2"></div> Carregando...</td></tr>`;

        fetch(`/api/rh/colaboradores/?${params.toString()}`)
            .then(r => r.json())
            .then(data => {
                if (data.success) {
                    const colab    = data.colaboradores || [];
                    const semFicha = data.usuarios_sem_ficha || [];
                    const mostra   = (filterStatus.value === 'ativo' || filterStatus.value === 'todos');
                    window.allColaboradores = colab.concat(mostra ? semFicha : []);
                    renderTable(window.allColaboradores);
                }
            });
    }

    // ─── Renderizar tabela com filtro + paginação ─────────────────────────────
    function renderTable(todos) {
        const searchTerm = (searchInput.value || '').toLowerCase().trim();
        const searchDig  = (searchTerm.match(/\d/g) || []).join('');

        const filtered = todos.filter(c => {
            if (!searchTerm) return true;
            return (c.nome      || '').toLowerCase().includes(searchTerm)
                || (c.cargo     || '').toLowerCase().includes(searchTerm)
                || (c.email     || '').toLowerCase().includes(searchTerm)
                || (c.username  || '').toLowerCase().includes(searchTerm)
                || (searchDig.length >= 6 && (c.cpf || '').replace(/\D/g, '').includes(searchDig));
        });

        const pp       = parseInt(perPage.value) || 10;
        const total    = filtered.length;
        const totalPag = Math.max(1, Math.ceil(total / pp));
        if (currentPage > totalPag) currentPage = totalPag;

        const inicio = (currentPage - 1) * pp;
        const pagina = filtered.slice(inicio, inicio + pp);

        // Info
        const info = document.getElementById('paginacaoInfo');
        if (info) {
            if (total === 0) {
                info.textContent = '0 registros';
            } else {
                info.textContent = `${inicio + 1} a ${Math.min(inicio + pp, total)} de ${total}`;
            }
        }

        // Paginação
        renderPaginacao(totalPag);

        // Linhas
        if (pagina.length === 0) {
            tbody.innerHTML = `<tr><td colspan="7" class="text-center py-5 text-muted">
                Nenhum funcionário encontrado.</td></tr>`;
            return;
        }

        tbody.innerHTML = pagina.map(c => {
            // Usuário sem ficha
            if (c.tipo === 'usuario_sem_ficha') {
                return `<tr>
                    <td class="px-4 py-3">
                        <div class="d-flex align-items-center gap-3">
                            <img src="${c.foto_url || '{% static "img/avatar_placeholder.png" %}'}"
                                 class="avatar-mini" alt="">
                            <span class="fw-semibold text-dark">${c.nome || '—'}</span>
                        </div>
                    </td>
                    <td class="text-muted small">—</td>
                    <td class="text-muted small">${c.department || '—'}</td>
                    <td class="text-muted small">${c.cargo || 'Usuário Nexus'}</td>
                    <td class="text-muted small">—</td>
                    <td><span class="status-badge badge-sem-ficha">Sem ficha RH</span></td>
                    <td class="text-end pe-4">
                        <button class="btn-row-action" title="Criar ficha RH"
                            onclick="criarFichaParaUsuario('${(c.user_id || '').toString().replace(/'/g, "\\'")}')">
                            <i class="bi bi-person-plus"></i>
                        </button>
                    </td>
                </tr>`;
            }

            // Colaborador com ficha
            const statusLabel = c.status_display || c.status || '—';
            return `<tr>
                <td class="px-4 py-3">
                    <div class="d-flex align-items-center gap-3">
                        <img src="${c.foto_url || '{% static "img/avatar_placeholder.png" %}'}"
                             class="avatar-mini" alt="">
                        <a href="/rh/colaboradores/${c.id}/" class="fw-semibold text-dark text-decoration-none">
                            ${c.nome || '—'}
                        </a>
                    </div>
                </td>
                <td class="text-muted small">${c.empresa || '—'}</td>
                <td class="text-muted small">${c.department || '—'}</td>
                <td class="text-muted small">${c.cargo || '—'}</td>
                <td class="text-muted small" style="white-space: nowrap;">${c.tempo_empresa || '—'}</td>
                <td><span class="status-badge badge-${c.status}">${statusLabel}</span></td>
                <td class="text-end pe-4">
                    <div class="d-flex gap-1 justify-content-end">
                        <a href="/rh/colaboradores/${c.id}/" class="btn-row-action" title="Ver Dossiê">
                            <i class="bi bi-eye"></i>
                        </a>
                        <button class="btn-row-action" title="Editar"
                            onclick="editColaborador('${c.id}')">
                            <i class="bi bi-pencil"></i>
                        </button>
                        <button class="btn-row-action danger" title="Excluir"
                            onclick="deleteColaborador('${c.id}', '${(c.nome || '').replace(/'/g, "\\'")}')">
                            <i class="bi bi-trash"></i>
                        </button>
                    </div>
                </td>
            </tr>`;
        }).join('');
    }

    // ─── Paginação ────────────────────────────────────────────────────────────
    function renderPaginacao(total) {
        const ul = document.getElementById('paginacaoControles');
        if (!ul) return;
        ul.innerHTML = '';

        const prev = document.createElement('li');
        prev.className = `page-item ${currentPage === 1 ? 'disabled' : ''}`;
        prev.innerHTML = `<button class="page-link" ${currentPage === 1 ? 'disabled' : ''}>‹</button>`;
        prev.querySelector('button').onclick = () => { if (currentPage > 1) { currentPage--; renderTable(window.allColaboradores || []); } };
        ul.appendChild(prev);

        // Máx 7 páginas visíveis
        const start = Math.max(1, currentPage - 3);
        const end   = Math.min(total, start + 6);
        for (let p = start; p <= end; p++) {
            const li = document.createElement('li');
            li.className = `page-item ${p === currentPage ? 'active' : ''}`;
            li.innerHTML = `<button class="page-link">${p}</button>`;
            const pg = p;
            li.querySelector('button').onclick = () => { currentPage = pg; renderTable(window.allColaboradores || []); };
            ul.appendChild(li);
        }

        const next = document.createElement('li');
        next.className = `page-item ${currentPage === total ? 'disabled' : ''}`;
        next.innerHTML = `<button class="page-link" ${currentPage === total ? 'disabled' : ''}>›</button>`;
        next.querySelector('button').onclick = () => { if (currentPage < total) { currentPage++; renderTable(window.allColaboradores || []); } };
        ul.appendChild(next);
    }

    // ─── Criar ficha para usuário sem ficha ──────────────────────────────────
    window.criarFichaParaUsuario = function(userId) {
        const userObj = (window.allColaboradores || []).find(x => x.tipo === 'usuario_sem_ficha' && x.user_id == userId);
        if (!userObj) return;
        document.getElementById('colaboradorId').value = '';
        document.getElementById('colaboradorUserId').value = userObj.user_id || '';
        form.reset();
        document.querySelector('[name="nome_completo"]').value = userObj.nome || '';
        document.querySelector('[name="department_id"]').value = userObj.department_id || '';
        document.getElementById('colaboradorUserId').value = userObj.user_id || '';
        document.getElementById('divCargoInicial').style.display = 'none';
        document.getElementById('modalTitle').textContent = 'Criar ficha RH para ' + (userObj.nome || 'usuário');
        document.getElementById('previewFoto').src = userObj.foto_url || "{% static 'img/avatar_placeholder.png' %}";
        new bootstrap.Modal(document.getElementById('modalColaborador')).show();
    };

    // ─── Listeners ───────────────────────────────────────────────────────────
    filterStatus.addEventListener('change', loadColaboradores);
    filterDept.addEventListener('change',   loadColaboradores);
    perPage.addEventListener('change',      () => { currentPage = 1; renderTable(window.allColaboradores || []); });
    searchInput.addEventListener('input',   () => { currentPage = 1; renderTable(window.allColaboradores || []); });
    document.getElementById('btnRefresh').addEventListener('click', loadColaboradores);

    inputFoto.addEventListener('change', e => {
        if (e.target.files[0]) previewFoto.src = URL.createObjectURL(e.target.files[0]);
    });

    // Reset modal ao abrir para novo cadastro
    document.querySelectorAll('[data-bs-target="#modalColaborador"]').forEach(btn => {
        btn.addEventListener('click', function() {
            document.getElementById('colaboradorUserId').value = '';
            document.getElementById('colaboradorId').value = '';
            document.getElementById('divCargoInicial').style.display = '';
            form.reset();
            previewFoto.src = "{% static 'img/avatar_placeholder.png' %}";
            document.getElementById('modalTitle').textContent = 'Cadastrar Funcionário';
        });
    });

    // ─── Submit do form ───────────────────────────────────────────────────────
    form.addEventListener('submit', function (e) {
        e.preventDefault();
        const formData = new FormData(this);
        fetch('/api/rh/colaboradores/save/', {
            method: 'POST',
            body: formData,
            headers: { 'X-CSRFToken': '{{ csrf_token }}' }
        })
        .then(r => r.json())
        .then(data => {
            if (data.success) {
                bootstrap.Modal.getInstance(document.getElementById('modalColaborador')).hide();
                Swal.fire({ icon: 'success', title: 'Sucesso!', text: data.message || 'Cadastro realizado.', timer: 2000, showConfirmButton: false });
                loadColaboradores();
                form.reset();
                previewFoto.src = "{% static 'img/avatar_placeholder.png' %}";
                document.getElementById('modalTitle').textContent = 'Cadastrar Funcionário';
            } else {
                Swal.fire({ icon: 'error', title: 'Erro', text: data.error });
            }
        });
    });

    loadColaboradores();
});

// ─── Editar ───────────────────────────────────────────────────────────────────
window.editColaborador = function (id) {
    document.getElementById('colaboradorUserId').value = '';
    fetch(`/api/rh/colaboradores/${id}/`)
        .then(r => r.json())
        .then(data => {
            if (data.success) {
                const c    = data.colaborador;
                const form = document.getElementById('formColaborador');
                form.querySelector('[name="id"]').value = c.id;
                form.querySelector('[name="nome_completo"]').value = c.nome_completo || '';
                form.querySelector('[name="cpf"]').value  = c.cpf  || '';
                form.querySelector('[name="rg"]').value   = c.rg   || '';
                const dtNasc = c.data_nascimento || '';
                form.querySelector('[name="data_nascimento"]').value = dtNasc.includes('/') ? dtNasc.split('/').reverse().join('-') : dtNasc;
                const dtAdm = c.data_admissao || '';
                form.querySelector('[name="data_admissao"]').value = dtAdm.includes('/') ? dtAdm.split('/').reverse().join('-') : dtAdm;
                form.querySelector('[name="department_id"]').value = c.department_id || '';
                form.querySelector('[name="cargo"]').value = c.cargo_atual || '';
                form.querySelector('[name="salario_atual"]').value = c.salario_atual || '';
                form.querySelector('[name="status"]').value = c.status || 'ativo';
                document.getElementById('divCargoInicial').style.display = 'none';
                document.getElementById('previewFoto').src = c.foto_url || "{% static 'img/avatar_placeholder.png' %}";
                document.getElementById('modalTitle').textContent = 'Editar Funcionário';
                new bootstrap.Modal(document.getElementById('modalColaborador')).show();
            }
        });
};

// ─── Excluir ──────────────────────────────────────────────────────────────────
window.deleteColaborador = function (id, nome) {
    Swal.fire({
        title: 'Tem certeza?',
        text: `Deseja excluir o colaborador ${nome}? Esta ação não pode ser desfeita.`,
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#dc2626',
        cancelButtonColor:  '#6b7280',
        confirmButtonText: 'Sim, excluir!',
        cancelButtonText: 'Cancelar'
    }).then(result => {
        if (result.isConfirmed) {
            fetch(`/api/rh/colaboradores/${id}/delete/`, {
                method: 'POST',
                headers: { 'X-CSRFToken': '{{ csrf_token }}' }
            })
            .then(r => r.json())
            .then(data => {
                if (data.success) { Swal.fire('Excluído!', data.message, 'success'); location.reload(); }
                else              { Swal.fire('Erro!', data.error, 'error'); }
            });
        }
    });
};
</script>
{% endblock %}
