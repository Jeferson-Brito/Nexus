<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ponto - Nexus</title>
    {% load static %}
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:       #f0f4f8;
            --surface:  #ffffff;
            --border:   #dde3ec;
            --text:     #1e293b;
            --muted:    #64748b;
            --blue:     #2563eb;
            --blue-l:   #eff6ff;
            --radius:   16px;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            height: 100dvh;
            overflow: hidden;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        /* ── SCREENSAVER ── */
        #screen-idle {
            position: fixed; inset: 0;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 8px;
            background: linear-gradient(160deg, #f0f4f8 0%, #e2eaf5 100%);
        }
        .idle-logo { width: min(280px, 55vw); margin-bottom: 16px; }
        #idle-hora {
            font-size: clamp(3.5rem, 12vw, 7rem);
            font-weight: 800; font-variant-numeric: tabular-nums;
            letter-spacing: 4px; color: var(--blue); line-height: 1;
        }
        #idle-data { font-size: clamp(.8rem,2.2vw,1rem); color: var(--muted); text-transform: uppercase; letter-spacing: 3px; margin-top: 4px; }
        #btn-iniciar {
            margin-top: 36px;
            padding: 18px 56px;
            font-size: clamp(1rem, 2.5vw, 1.2rem);
            font-weight: 700; background: var(--blue); color: #fff;
            border: none; border-radius: 100px; cursor: pointer;
            box-shadow: 0 8px 30px rgba(37,99,235,.35);
            transition: transform .15s, box-shadow .15s;
        }
        #btn-iniciar:hover  { transform: scale(1.04); box-shadow: 0 12px 40px rgba(37,99,235,.5); }
        #btn-iniciar:active { transform: scale(.97); }

        /* ── TOPBAR ── */
        #topbar {
            position: fixed; top: 0; left: 0; right: 0;
            padding: 10px 20px;
            display: none; justify-content: space-between; align-items: center;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            box-shadow: 0 1px 6px rgba(0,0,0,.06);
            z-index: 20;
        }
        .topbar-logo { height: 32px; }
        .topbar-clock {
            font-size: 1rem; font-weight: 700;
            color: var(--blue); font-variant-numeric: tabular-nums;
        }

        /* ── TELAS INTERNAS ── */
        .kiosk-screen {
            position: fixed; inset: 0;
            display: none; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 80px 20px 24px;
            background: var(--bg);
            overflow-y: auto;
        }
        .kiosk-screen.active { display: flex; }

        /* ── CARD GENÉRICO ── */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: calc(var(--radius) + 4px);
            box-shadow: 0 4px 20px rgba(0,0,0,.07);
        }

        /* ── TELA CPF ── */
        .cpf-card {
            width: 100%; max-width: 440px;
            display: flex; flex-direction: column; align-items: center; gap: 20px;
        }
        .cpf-card h2 { font-size: clamp(1.1rem,3.5vw,1.3rem); text-align: center; color: var(--text); font-weight: 400; line-height: 1.6; }
        .cpf-card h2 strong { color: var(--blue); font-weight: 700; }

        #cpf-dots { display: flex; gap: 10px; }
        .cpf-dot {
            width: 14px; height: 14px; border-radius: 50%;
            background: var(--border); border: 2px solid #c7d0db;
            transition: all .2s;
        }
        .cpf-dot.filled {
            background: var(--blue); border-color: var(--blue);
            box-shadow: 0 0 8px rgba(37,99,235,.4);
            transform: scale(1.15);
        }

        #cpf-input-real {
            width: 100%; padding: 16px 20px;
            font-size: 1.8rem; letter-spacing: 14px; text-align: center;
            background: var(--bg); border: 2px solid var(--border);
            border-radius: var(--radius); color: var(--text);
            caret-color: var(--blue); outline: none;
            transition: border-color .2s, box-shadow .2s;
            -webkit-appearance: none;
        }
        #cpf-input-real:focus { border-color: var(--blue); box-shadow: 0 0 0 4px rgba(37,99,235,.12); }
        #cpf-input-real::placeholder { color: var(--border); letter-spacing: 6px; font-size: 1.4rem; }

        .btn-primary {
            width: 100%; padding: 14px;
            background: var(--blue); color: #fff;
            border: none; border-radius: var(--radius);
            font-size: 1rem; font-weight: 700; cursor: pointer;
            transition: background .2s, transform .1s;
        }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-primary:active { transform: scale(.98); }
        .btn-primary:disabled { background: #94a3b8; cursor: not-allowed; }

        .btn-ghost {
            background: transparent; color: var(--muted);
            border: 1px solid var(--border);
            padding: 10px 28px; border-radius: 100px;
            font-size: .9rem; cursor: pointer;
            transition: all .2s;
        }
        .btn-ghost:hover { background: var(--bg); color: var(--text); }

        /* ── TELA TIPO ── */
        .tipo-card { width: 100%; max-width: 560px; display: flex; flex-direction: column; align-items: center; gap: 16px; }

        .user-badge {
            width: 100%; padding: 22px 28px; text-align: center;
            display: flex; flex-direction: column; align-items: center; gap: 8px;
        }
        .user-avatar-wrap {
            width: 76px; height: 76px; border-radius: 50%;
            border: 3px solid var(--blue); overflow: hidden;
            display: flex; align-items: center; justify-content: center;
            background: var(--blue-l);
            font-size: 1.9rem; font-weight: 700; color: var(--blue);
        }
        .user-avatar-wrap img { width: 100%; height: 100%; object-fit: cover; }
        .user-badge h3 { font-size: clamp(1.1rem,4vw,1.4rem); font-weight: 700; }
        .user-badge p  { font-size: .9rem; color: var(--muted); }

        .tipo-label { font-size: .9rem; color: var(--muted); }

        .tipo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; }
        .type-btn {
            padding: 20px 14px; border-radius: var(--radius); border: 2px solid transparent;
            cursor: pointer; font-size: clamp(.85rem,2.5vw,1rem);
            font-weight: 700; display: flex; flex-direction: column;
            align-items: center; gap: 8px; transition: all .2s;
            position: relative;
        }
        .type-btn i { font-size: 1.6rem; }
        .type-btn.entrada  { background: #f0fdf4; border-color: #bbf7d0; color: #166534; }
        .type-btn.almoco   { background: #fefce8; border-color: #fde68a; color: #854d0e; }
        .type-btn.retorno  { background: var(--blue-l); border-color: #bfdbfe; color: #1d4ed8; }
        .type-btn.saida    { background: #fef2f2; border-color: #fecaca; color: #991b1b; }
        .type-btn.entrada:hover:not(:disabled)  { background:#dcfce7; border-color:#4ade80; }
        .type-btn.almoco:hover:not(:disabled)   { background:#fef9c3; border-color:#eab308; }
        .type-btn.retorno:hover:not(:disabled)  { background:#dbeafe; border-color:#3b82f6; }
        .type-btn.saida:hover:not(:disabled)    { background:#fee2e2; border-color:#f87171; }

        .type-btn:disabled {
            opacity: .45; cursor: not-allowed;
        }
        .type-btn:disabled::after {
            content: "Já registrado";
            position: absolute; bottom: 6px;
            font-size: .68rem; color: var(--muted); font-weight: 400;
        }

        /* ── TELA CÂMERA ── */
        .camera-card { width: 100%; max-width: 400px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
        .camera-card h2 { font-size: clamp(.95rem,3vw,1.1rem); color: var(--muted); text-align: center; font-weight: 400; }

        .camera-wrap {
            position: relative; width: 100%; aspect-ratio: 3/4;
            border-radius: 20px; overflow: hidden;
            border: 2px solid var(--border);
            background: #0d1117;
        }
        .camera-wrap video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        .face-guide-wrap {
            position: absolute; inset: 0;
            display: flex; align-items: center; justify-content: center;
            pointer-events: none;
        }
        .face-guide {
            width: 55%; aspect-ratio: 3/4; border: 3px dashed rgba(255,255,255,.5);
            border-radius: 50%; animation: pulse 2s infinite;
            box-shadow: 0 0 0 9999px rgba(0,0,0,.5);
        }
        @keyframes pulse { 0%,100% { opacity:.5; } 50% { opacity:1; } }

        #camera-loading {
            position: absolute; inset: 0;
            background: #1e293b;
            display: flex; align-items: center; justify-content: center; z-index: 5;
        }
        .spinner {
            width: 44px; height: 44px;
            border: 4px solid rgba(37,99,235,.25);
            border-top-color: var(--blue);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Botões na tela de câmera */
        .camera-controls {
            display: flex; align-items: center; justify-content: center;
            width: 100%; position: relative; height: 72px;
        }
        .btn-shutter {
            width: 68px; height: 68px; border-radius: 50%;
            background: var(--blue); border: 4px solid #fff;
            box-shadow: 0 4px 20px rgba(37,99,235,.5);
            color: #fff; font-size: 1.5rem;
            cursor: pointer; transition: transform .15s, box-shadow .15s;
            display: flex; align-items: center; justify-content: center;
        }
        .btn-shutter:hover { transform: scale(1.06); box-shadow: 0 6px 28px rgba(37,99,235,.6); }
        .btn-shutter:active { transform: scale(.96); }
        .btn-shutter:disabled { background: #94a3b8; box-shadow: none; cursor: not-allowed; }

        .btn-cam-back {
            position: absolute; left: 0;
            background: transparent; border: 1px solid var(--border);
            border-radius: 100px; padding: 10px 18px;
            font-size: .875rem; color: var(--muted); cursor: pointer;
            transition: all .2s;
        }
        .btn-cam-back:hover { background: var(--bg); color: var(--text); }

        /* ── TELA PREVIEW ── */
        .preview-card { width: 100%; max-width: 400px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
        .preview-card h2 { font-size: clamp(.95rem,3vw,1.1rem); color: var(--text); text-align: center; }
        .preview-wrap {
            width: 100%; aspect-ratio: 3/4;
            border-radius: 20px; overflow: hidden;
            border: 2px solid var(--border);
        }
        #preview-img { width: 100%; height: 100%; object-fit: cover; }
        .preview-btns { display: flex; gap: 12px; width: 100%; }
        .btn-outline {
            flex: 1; padding: 13px;
            background: transparent; border: 2px solid var(--blue); color: var(--blue);
            border-radius: var(--radius); font-size: .95rem; font-weight: 600;
            cursor: pointer; transition: all .2s;
        }
        .btn-outline:hover { background: var(--blue-l); }

        /* ── FULLSCREEN BTN ── */
        #btn-fs {
            position: fixed; bottom: 10px; right: 10px;
            width: 34px; height: 34px; border-radius: 50%;
            background: rgba(0,0,0,.08); border: none;
            color: rgba(0,0,0,.2); cursor: pointer;
            transition: all .3s; z-index: 999;
        }
        #btn-fs:hover { color: var(--muted); background: rgba(0,0,0,.12); }

        /* SweetAlert */
        .ks-swal.swal2-popup { border-radius: 20px; }
    </style>
</head>
<body>
{% load static %}

<!-- ══ SCREENSAVER ══ -->
<div id="screen-idle">
    <img src="{% static 'img/logo_nexus_horizontal.png' %}" alt="Nexus" class="idle-logo">
    <div id="idle-hora">00:00:00</div>
    <div id="idle-data">--</div>
    <button id="btn-iniciar" onclick="abrirCPF()">
        <i class="fa-solid fa-fingerprint" style="margin-right:8px;"></i>Iniciar
    </button>
</div>

<!-- ══ TOPBAR ══ -->
<div id="topbar">
    <img src="{% static 'img/logo_nexus_horizontal.png' %}" alt="Nexus" class="topbar-logo">
    <span class="topbar-clock" id="topbar-hora">00:00:00</span>
</div>

<!-- ══ TELA 1: CPF ══ -->
<div id="screen-cpf" class="kiosk-screen">
    <div class="cpf-card">
        <h2>Informe os <strong>6 primeiros dígitos</strong><br>do seu CPF</h2>

        <div id="cpf-dots">
            <div class="cpf-dot" id="d0"></div>
            <div class="cpf-dot" id="d1"></div>
            <div class="cpf-dot" id="d2"></div>
            <div class="cpf-dot" id="d3"></div>
            <div class="cpf-dot" id="d4"></div>
            <div class="cpf-dot" id="d5"></div>
        </div>

        <input id="cpf-input-real" type="tel" inputmode="numeric" pattern="[0-9]*"
               maxlength="6" placeholder="••••••"
               autocomplete="off" autocorrect="off" spellcheck="false">

        <button class="btn-primary" id="btn-continuar" onclick="submeterCPF()" disabled>
            Continuar <i class="fa-solid fa-arrow-right" style="margin-left:6px;"></i>
        </button>

        <button class="btn-ghost" onclick="voltarIdle()">
            <i class="fa-solid fa-arrow-left" style="margin-right:6px;"></i>Cancelar
        </button>
    </div>
</div>

<!-- ══ TELA 2: TIPO ══ -->
<div id="screen-tipo" class="kiosk-screen">
    <div class="tipo-card">
        <div class="card user-badge">
            <div class="user-avatar-wrap">
                <img id="user-avatar" src="" alt="" style="display:none;">
                <span id="user-initials"></span>
            </div>
            <h3 id="user-name">—</h3>
            <p id="user-dept">—</p>
        </div>

        <span class="tipo-label">Selecione o tipo de registro:</span>

        <div class="tipo-grid">
            <button class="type-btn entrada" data-type="entrada">
                <i class="fa-solid fa-right-to-bracket"></i>Entrada
            </button>
            <button class="type-btn almoco" data-type="saida_almoco">
                <i class="fa-solid fa-utensils"></i>Saída p/ Almoço
            </button>
            <button class="type-btn retorno" data-type="retorno_almoco">
                <i class="fa-solid fa-person-walking-arrow-right"></i>Retorno Almoço
            </button>
            <button class="type-btn saida" data-type="saida">
                <i class="fa-solid fa-right-from-bracket"></i>Saída Final
            </button>
        </div>

        <button class="btn-ghost" onclick="voltarIdle()">
            <i class="fa-solid fa-arrow-left" style="margin-right:6px;"></i>Cancelar
        </button>
    </div>
</div>

<!-- ══ TELA 3: CÂMERA ══ -->
<div id="screen-camera" class="kiosk-screen">
    <div class="camera-card">
        <h2>Posicione seu rosto na marcação e capture a foto</h2>

        <div class="camera-wrap">
            <video id="camera-stream" autoplay playsinline muted></video>
            <div class="face-guide-wrap"><div class="face-guide"></div></div>
            <div id="camera-loading"><div class="spinner"></div></div>
        </div>

        <div class="camera-controls">
            <button class="btn-cam-back" onclick="voltarTipo()">
                <i class="fa-solid fa-arrow-left" style="margin-right:4px;"></i>Voltar
            </button>
            <button class="btn-shutter" id="btn-shutter" onclick="capturarFoto()" disabled title="Tirar foto">
                <i class="fa-solid fa-camera"></i>
            </button>
        </div>
    </div>
</div>

<!-- ══ TELA 4: PREVIEW DA FOTO ══ -->
<div id="screen-preview" class="kiosk-screen">
    <div class="preview-card">
        <h2>Confira sua foto</h2>
        <div class="preview-wrap">
            <img id="preview-img" src="" alt="Sua foto">
        </div>
        <div class="preview-btns">
            <button class="btn-outline" onclick="tirarNovamente()">
                <i class="fa-solid fa-rotate-left" style="margin-right:6px;"></i>Nova foto
            </button>
            <button class="btn-primary" style="flex:1;" onclick="concluirRegistro()">
                Concluir <i class="fa-solid fa-check" style="margin-left:6px;"></i>
            </button>
        </div>
    </div>
</div>

<!-- Fullscreen -->
<button id="btn-fs" onclick="toggleFS()"><i class="fa-solid fa-expand"></i></button>

<script>
// ─── Estado ──────────────────────────────────────────────────────────
const ST = { cpf:'', colaboradorId:null, tipoPonto:null, videoStream:null, fotoBase64:null };

// ─── Relógio ──────────────────────────────────────────────────────────
function tick() {
    const n = new Date();
    const hms = [n.getHours(), n.getMinutes(), n.getSeconds()].map(v=>String(v).padStart(2,'0')).join(':');
    document.getElementById('idle-hora').textContent = hms;
    document.getElementById('topbar-hora').textContent = hms;
    document.getElementById('idle-data').textContent =
        n.toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'long',year:'numeric'}).toUpperCase();
}
setInterval(tick, 1000); tick();

// ─── Navegação ──────────────────────────────────────────────────────
const ALL_SCREENS = ['screen-cpf','screen-tipo','screen-camera','screen-preview'];

function showScreen(id) {
    ALL_SCREENS.forEach(s => document.getElementById(s).classList.remove('active'));
    const topbar = document.getElementById('topbar');
    if (!id) {
        topbar.style.display = 'none';
        document.getElementById('screen-idle').style.display = '';
    } else {
        document.getElementById('screen-idle').style.display = 'none';
        topbar.style.display = 'flex';
        document.getElementById(id).classList.add('active');
    }
}

function abrirCPF() {
    ST.cpf = ''; ST.colaboradorId = null; ST.tipoPonto = null; ST.fotoBase64 = null;
    const inp = document.getElementById('cpf-input-real');
    inp.value = '';
    document.getElementById('btn-continuar').disabled = true;
    updateDots();
    showScreen('screen-cpf');
    setTimeout(() => inp.focus(), 100);
}

function voltarIdle() {
    pararCamera();
    ST.cpf=''; ST.colaboradorId=null; ST.tipoPonto=null; ST.fotoBase64=null;
    document.getElementById('cpf-input-real').value='';
    updateDots();
    showScreen(null);
}

function voltarTipo() {
    pararCamera();
    ST.tipoPonto = null;
    showScreen('screen-tipo');
}

// ─── CPF ──────────────────────────────────────────────────────────
const cpfInput = document.getElementById('cpf-input-real');
cpfInput.addEventListener('input', () => {
    cpfInput.value = cpfInput.value.replace(/\D/g,'').slice(0,6);
    ST.cpf = cpfInput.value;
    updateDots();
    document.getElementById('btn-continuar').disabled = ST.cpf.length < 6;
});
// Enter também confirma
cpfInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && ST.cpf.length === 6) submeterCPF();
});

function updateDots() {
    for (let i=0; i<6; i++)
        document.getElementById('d'+i).className = 'cpf-dot' + (i < ST.cpf.length ? ' filled' : '');
}

async function submeterCPF() {
    if (ST.cpf.length < 6) return;
    cpfInput.blur();
    Swal.fire({ title:'Buscando...', allowOutsideClick:false, didOpen:()=>Swal.showLoading(), customClass:{popup:'ks-swal'} });
    try {
        const res = await fetch('/api/ponto/buscar-colaborador/', {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({cpf_iniciais: ST.cpf})
        });
        const data = await res.json();
        if (!res.ok) {
            Swal.fire({icon:'error', title:'Não encontrado', text: data.erro||'CPF não localizado.',
                customClass:{popup:'ks-swal'}, timer:3000, showConfirmButton:false});
            ST.cpf=''; cpfInput.value=''; updateDots();
            document.getElementById('btn-continuar').disabled=true;
            setTimeout(() => cpfInput.focus(), 3200);
            return;
        }
        Swal.close();
        ST.colaboradorId = data.id;

        // Avatar
        const av = document.getElementById('user-avatar');
        const ini = document.getElementById('user-initials');
        document.getElementById('user-name').textContent = data.nome;
        document.getElementById('user-dept').textContent = `${data.cargo} • ${data.departamento}`;
        if (data.foto_url) {
            av.src = data.foto_url; av.style.display='block'; ini.textContent='';
        } else {
            av.style.display='none';
            const parts = data.nome.split(' ');
            ini.textContent = parts[0][0].toUpperCase() + (parts.length>1 ? parts[parts.length-1][0].toUpperCase() : '');
        }

        // Verificar pontos já registrados hoje
        await verificarPontosHoje();
        showScreen('screen-tipo');
    } catch(e) {
        Swal.fire({icon:'error', title:'Erro de conexão', text:'Tente novamente.', customClass:{popup:'ks-swal'}});
    }
}

// ─── Verificar pontos do dia ──────────────────────────────────────────
async function verificarPontosHoje() {
    const hoje = new Date().toISOString().split('T')[0];
    try {
        const res = await fetch(`/api/ponto/registros/?colaborador_id=${ST.colaboradorId}&data_inicio=${hoje}&data_fim=${hoje}`);
        const data = await res.json();
        const tiposRegistrados = (data.registros || []).map(r => r.tipo);
        document.querySelectorAll('.type-btn').forEach(btn => {
            const tipo = btn.getAttribute('data-type');
            btn.disabled = tiposRegistrados.includes(tipo);
        });
    } catch(e) {
        // Se falhar a verificação, deixa todos habilitados
        document.querySelectorAll('.type-btn').forEach(b => b.disabled=false);
    }
}

// ─── Tipo de ponto ──────────────────────────────────────────────────
document.querySelectorAll('.type-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        if (btn.disabled) return;
        ST.tipoPonto = btn.getAttribute('data-type');
        showScreen('screen-camera');
        startCamera();
    });
});

// ─── Câmera ──────────────────────────────────────────────────────────
async function startCamera() {
    const loading = document.getElementById('camera-loading');
    const shutter = document.getElementById('btn-shutter');
    const video   = document.getElementById('camera-stream');
    loading.style.display = 'flex';
    shutter.disabled = true;

    try {
        const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}, audio:false});
        ST.videoStream = stream;
        video.srcObject = stream;
        video.onloadedmetadata = () => {
            loading.style.display = 'none';
            shutter.disabled = false;
        };
    } catch(err) {
        loading.style.display = 'none';
        Swal.fire({icon:'warning', title:'Câmera inacessível', text:'Prosseguindo sem foto.',
            customClass:{popup:'ks-swal'}, confirmButtonText:'Continuar'
        }).then(() => { ST.fotoBase64 = null; enviarRegistro(); });
    }
}

function pararCamera() {
    if (ST.videoStream) {
        ST.videoStream.getTracks().forEach(t=>t.stop());
        ST.videoStream = null;
    }
    const v = document.getElementById('camera-stream');
    v.srcObject = null;
}

function capturarFoto() {
    const video = document.getElementById('camera-stream');
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0);
    ST.fotoBase64 = canvas.toDataURL('image/jpeg', 0.8);

    // Mostrar preview
    document.getElementById('preview-img').src = ST.fotoBase64;
    pararCamera();
    showScreen('screen-preview');
}

function tirarNovamente() {
    ST.fotoBase64 = null;
    showScreen('screen-camera');
    startCamera();
}

async function concluirRegistro() {
    enviarRegistro();
}

// ─── Enviar registro ─────────────────────────────────────────────────
async function enviarRegistro() {
    Swal.fire({title:'Registrando...', allowOutsideClick:false, didOpen:()=>Swal.showLoading(), customClass:{popup:'ks-swal'}});
    try {
        const res = await fetch('/api/ponto/registrar/', {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({
                colaborador_id: ST.colaboradorId,
                tipo: ST.tipoPonto,
                origem: 'tablet',
                foto_base64: ST.fotoBase64
            })
        });
        const data = await res.json();
        if (res.ok) {
            Swal.fire({icon:'success', title:'Registrado!',
                text: data.mensagem || `Ponto registrado às ${data.hora}.`,
                customClass:{popup:'ks-swal'}, timer:4000, showConfirmButton:false
            }).then(voltarIdle);
        } else {
            Swal.fire({icon:'error', title:'Falha', text: data.erro||'Erro ao registrar.', customClass:{popup:'ks-swal'}}).then(voltarIdle);
        }
    } catch(e) {
        Swal.fire({icon:'error', title:'Erro de conexão', text:'Tente novamente.', customClass:{popup:'ks-swal'}}).then(voltarIdle);
    }
}

// ─── Fullscreen ──────────────────────────────────────────────────────
function toggleFS() {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
    else document.exitFullscreen();
}
document.addEventListener('keydown', e => {
    if (e.key==='F5' || (e.ctrlKey && e.key==='r')) e.preventDefault();
});
</script>
