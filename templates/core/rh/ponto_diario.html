{% extends "base.html" %}
{% load static %}

{% block content %}
<style>
    #cardPontoDiario .table-responsive {
        max-height: calc(100vh - 300px);
        overflow-y: auto;
    }
    .col-info { min-width: 150px; }
    .col-horario { width: 85px; text-align: center; }
    .table thead th {
        position: sticky;
        top: 0;
        z-index: 10;
        background: #f8f9fa;
        white-space: nowrap;
    }
</style>

<div class="container-fluid py-4">
    <div class="row mb-4 align-items-center">
        <div class="col">
            <h2 class="h4 mb-0 text-gray-800">
                <i class="bi bi-people-fill text-primary me-2"></i>
                Ponto Diário (Equipe)
            </h2>
            <p class="text-muted small mb-0">Auditoria em lote para todos os funcionários em uma data específica.</p>
        </div>
        <div class="col-auto d-flex gap-2">
            <div class="input-group input-group-sm shadow-sm">
                <span class="input-group-text bg-white border-end-0"><i class="bi bi-calendar-event"></i></span>
                <input type="date" id="data_ponto" class="form-control border-start-0 ps-0" value="{% now 'Y-m-d' %}">
            </div>
            <button class="btn btn-primary btn-sm px-3 shadow-sm" onclick="carregarPontoDiario()">
                <i class="bi bi-arrow-repeat me-1"></i> Atualizar
            </button>
        </div>
    </div>

    <!-- Filtros Rápidos -->
    <div class="card border-0 shadow-sm mb-4">
        <div class="card-body p-3">
            <div class="row g-3 align-items-end">
                <div class="col-md-2">
                    <label class="form-label small fw-bold text-muted">Empresa</label>
                    <select id="f_empresa" class="form-select form-select-sm"><option value="">Todas</option></select>
                </div>
                <div class="col-md-2">
                    <label class="form-label small fw-bold text-muted">Departamento</label>
                    <select id="f_depto" class="form-select form-select-sm"><option value="">Todos</option></select>
                </div>
                <div class="col-md-2">
                    <label class="form-label small fw-bold text-muted">Cargo</label>
                    <select id="f_cargo" class="form-select form-select-sm"><option value="">Todos</option></select>
                </div>
                <div class="col-md-3">
                    <label class="form-label small fw-bold text-muted">Filtrar por nome...</label>
                    <input type="text" id="f_busca" class="form-control form-control-sm" placeholder="Nome do funcionário">
                </div>
                <div class="col-md-3">
                    <div class="form-check form-switch mb-1">
                        <input class="form-check-input" type="checkbox" id="f_apenas_incon">
                        <label class="form-check-label small" for="f_apenas_incon">Apenas inconsistências</label>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Tabela Geral -->
    <div class="card border-0 shadow-sm overflow-hidden" id="cardPontoDiario">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0 text-center">
                <thead class="bg-light">
                    <tr>
                        <th class="ps-4 text-start">Funcionário</th>
                        <th style="width: 50px;">Inc.</th>
                        <th>Previsto</th>
                        <th class="col-horario">Ent 1</th>
                        <th class="col-horario">Sai 1</th>
                        <th class="col-horario">Ent 2</th>
                        <th class="col-horario">Sai 2</th>
                        <th>Extras</th>
                        <th>Atraso</th>
                        <th>Saldo</th>
                        <th class="pe-4">Ações</th>
                    </tr>
                </thead>
                <tbody id="listaPontoDiario">
                    <tr>
                        <td colspan="11" class="py-5 text-muted">
                            <div class="spinner-border spinner-border-sm me-2"></div>
                            Carregando registros...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        carregarFiltros();
        carregarPontoDiario();

        // Bind filtros
        document.querySelectorAll('.form-select, #f_apenas_incon').forEach(el => {
            el.addEventListener('change', carregarPontoDiario);
        });
        document.getElementById('f_busca').addEventListener('keyup', (e) => {
            if(e.key === 'Enter') carregarPontoDiario();
        });
    });

    async function carregarFiltros() {
        const resp = await fetch('/api/rh/auxiliar-data/');
        const data = await resp.json();
        if(data.success) {
            populateSelect('f_empresa', data.empresas);
            populateSelect('f_depto', data.departments, 'id', 'name');
            populateSelect('f_cargo', data.cargos);
        }
    }

    function populateSelect(id, items, val='id', txt='nome') {
        const sel = document.getElementById(id);
        items.forEach(i => {
            const opt = document.createElement('option');
            opt.value = i[val];
            opt.innerText = i[txt];
            sel.appendChild(opt);
        });
    }

    async function carregarPontoDiario() {
        const dataSel = document.getElementById('data_ponto').value;
        const query = new URLSearchParams({
            data: dataSel,
            empresa: document.getElementById('f_empresa').value,
            department: document.getElementById('f_depto').value,
            cargo: document.getElementById('f_cargo').value,
            busca: document.getElementById('f_busca').value,
            apenas_incon: document.getElementById('f_apenas_incon').checked
        });

        const tbody = document.getElementById('listaPontoDiario');
        tbody.innerHTML = '<tr><td colspan="11" class="py-5 text-muted"><div class="spinner-border spinner-border-sm me-2"></div>Carregando registros...</td></tr>';

        try {
            const resp = await fetch(`/api/rh/ponto-diario/dados/?${query.toString()}`);
            const res = await resp.json();
            
            if (res.success) {
                renderLista(res.dias);
            } else {
                tbody.innerHTML = `<tr><td colspan="11" class="py-5 text-danger">Erro: ${res.erro}</td></tr>`;
            }
        } catch (e) {
            tbody.innerHTML = '<tr><td colspan="11" class="py-5 text-danger">Erro de conexão.</td></tr>';
        }
    }

    function renderLista(dias) {
        const tbody = document.getElementById('listaPontoDiario');
        if (dias.length === 0) {
            tbody.innerHTML = '<tr><td colspan="11" class="py-5 text-muted">Nenhum registro encontrado para este filtro.</td></tr>';
            return;
        }

        tbody.innerHTML = '';
        dias.forEach(d => {
            const tr = document.createElement('tr');
            
            let statusIcon = '';
            if (d.inconsistencia) {
                statusIcon = `<i class="bi ${d.inconsistencia.icone} fs-5" style="color: ${d.inconsistencia.cor};" title="${d.inconsistencia.nome}"></i>`;
            } else {
                statusIcon = d.status === 'OK' ? '<i class="bi bi-check-circle-fill text-success opacity-25"></i>' : '<i class="bi bi-exclamation-circle text-danger"></i>';
            }

            tr.innerHTML = `
                <td class="ps-4 text-start">
                    <div class="fw-bold text-dark">${d.colaborador_nome}</div>
                    <div class="text-muted extra-small">${d.cargo_nome || ''}</div>
                </td>
                <td>${statusIcon}</td>
                <td class="small opacity-75">${d.previsto || '-'}</td>
                <td class="fw-bold">${d.ent1 || '--:--'}</td>
                <td class="fw-bold">${d.sai1 || '--:--'}</td>
                <td class="fw-bold">${d.ent2 || '--:--'}</td>
                <td class="fw-bold">${d.sai2 || '--:--'}</td>
                <td class="text-success">${d.extra_total || '00:00'}</td>
                <td class="text-danger">${d.horas_atraso || '00:00'}</td>
                <td class="${d.banco_minutos >= 0 ? 'text-primary' : 'text-danger'} fw-bold">${d.banco_saldo || '00:00'}</td>
                <td class="pe-4">
                    <a href="/rh/apuracao/?colaborador_id=${d.colaborador_id}&data=${d.data_db}" class="btn btn-sm btn-outline-primary" title="Abrir Cartão Completo">
                        <i class="bi bi-eye"></i>
                    </a>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }
</script>
{% endblock %}
