{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container-fluid py-4">

    <!-- Painel principal -->
    <div class="card border-0 shadow-sm" style="border-radius: 12px; overflow: hidden;">

        <!-- Header azul -->
        <div class="card-header border-0 d-flex align-items-center justify-content-between py-3 px-4"
             style="background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);">
            <h5 class="fw-bold mb-0 text-white">Empresas</h5>
            <div class="d-flex gap-2">
                <a href="{% url 'rh_cadastro_empresa' %}" class="btn d-flex align-items-center gap-2"
                   style="background:rgba(255,255,255,0.2); color:#fff; border:1.5px solid rgba(255,255,255,0.6); font-weight:600; text-decoration:none;">
                    <i class="bi bi-plus-lg"></i> Adicionar
                </a>
                <div class="dropdown">
                    <button class="btn" data-bs-toggle="dropdown"
                        style="background:rgba(255,255,255,0.15); color:#fff; border:1.5px solid rgba(255,255,255,0.6); width:38px; height:38px; padding:0; display:flex; align-items:center; justify-content:center;">
                        <i class="bi bi-three-dots"></i>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" href="#" onclick="exportCSV()"><i class="bi bi-download me-2"></i>Exportar CSV</a></li>
                        <li><a class="dropdown-item" href="#" onclick="loadEmpresas()"><i class="bi bi-arrow-clockwise me-2"></i>Recarregar</a></li>
                    </ul>
                </div>
            </div>
        </div>

        <!-- Toolbar: mostrar + busca -->
        <div class="card-body border-bottom py-3 px-4">
            <div class="d-flex flex-wrap align-items-center gap-3">
                <div class="d-flex align-items-center gap-2 text-muted small">
                    Mostrar
                    <select id="perPageSelect" class="form-select form-select-sm" style="width: auto;">
                        <option value="10">10</option>
                        <option value="25">25</option>
                        <option value="50">50</option>
                        <option value="100">100</option>
                    </select>
                    registros
                </div>
                <div class="ms-auto d-flex align-items-center gap-2">
                    <label class="text-muted small mb-0">Buscar:</label>
                    <input type="text" id="searchInput" class="form-control form-control-sm"
                           placeholder="Nome, CNPJ..." style="width: 220px;">
                </div>
            </div>
        </div>

        <!-- Tabela -->
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0" id="empresasTable">
                <thead class="table-light">
                    <tr>
                        <th class="px-4 py-3" style="width:64px;"></th>
                        <th class="px-4 py-3" style="min-width:200px; cursor:pointer;" onclick="sortBy('nome')">
                            Nome <i class="bi bi-arrow-down-up text-muted ms-1" style="font-size:.75rem;"></i>
                        </th>
                        <th class="py-3" style="cursor:pointer;" onclick="sortBy('nome_fantasia')">
                            Nome Fantasia <i class="bi bi-arrow-down-up text-muted ms-1" style="font-size:.75rem;"></i>
                        </th>
                        <th class="py-3" style="cursor:pointer;" onclick="sortBy('cnpj')">
                            CNPJ <i class="bi bi-arrow-down-up text-muted ms-1" style="font-size:.75rem;"></i>
                        </th>
                        <th class="py-3">Número de Funcionários</th>
                        <th class="py-3 text-end pe-4"></th>
                    </tr>
                </thead>
                <tbody id="empresasTbody">
                    <tr>
                        <td colspan="5" class="text-center py-5 text-muted">
                            <div class="spinner-border spinner-border-sm me-2"></div> Carregando...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Footer: contagem + paginação -->
        <div class="card-footer bg-white border-top d-flex align-items-center justify-content-between py-3 px-4">
            <span class="text-muted small" id="paginacaoInfo">—</span>
            <nav>
                <ul class="pagination pagination-sm mb-0 gap-1" id="paginacaoControles"></ul>
            </nav>
        </div>
    </div>
</div>

<!-- Modal Confirmação de Exclusão -->
<div class="modal fade" id="modalDelete" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-sm">
        <div class="modal-content border-0 shadow">
            <div class="modal-body text-center py-4">
                <div class="mb-3" style="font-size:2rem; color:#ef4444;"><i class="bi bi-trash3"></i></div>
                <h6 class="fw-bold mb-1">Excluir empresa?</h6>
                <p class="text-muted small mb-3" id="deleteEmpresaNome">—</p>
                <div class="d-flex gap-2 justify-content-center">
                    <button class="btn btn-sm btn-light px-4" data-bs-dismiss="modal">Cancelar</button>
                    <button class="btn btn-sm btn-danger px-4" id="btnConfirmDelete">Excluir</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
let allEmpresas = [];
let currentPage = 1;
let perPage     = 10;
let sortField   = 'nome';
let sortAsc     = true;
let deleteId    = null;

document.addEventListener('DOMContentLoaded', () => {
    loadEmpresas();
    document.getElementById('searchInput').addEventListener('input', () => { currentPage = 1; render(); });
    document.getElementById('perPageSelect').addEventListener('change', e => { perPage = +e.target.value; currentPage = 1; render(); });
    document.getElementById('btnConfirmDelete').addEventListener('click', confirmDelete);
});

function loadEmpresas() {
    fetch('/api/rh/empresas/')
        .then(r => r.json())
        .then(data => {
            if (data.success) { allEmpresas = data.empresas; render(); }
            else showError('Erro ao carregar empresas.');
        })
        .catch(() => showError('Erro ao carregar empresas.'));
}

function sortBy(field) {
    if (sortField === field) sortAsc = !sortAsc;
    else { sortField = field; sortAsc = true; }
    render();
}

function render() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    let data = allEmpresas.filter(e =>
        (e.nome||'').toLowerCase().includes(q) ||
        (e.nome_fantasia||'').toLowerCase().includes(q) ||
        (e.cnpj||'').toLowerCase().includes(q)
    );
    data.sort((a,b) => {
        const va = (a[sortField]||'').toString().toLowerCase();
        const vb = (b[sortField]||'').toString().toLowerCase();
        return sortAsc ? va.localeCompare(vb) : vb.localeCompare(va);
    });
    const total = data.length;
    const pages = Math.max(1, Math.ceil(total/perPage));
    currentPage = Math.min(currentPage, pages);
    const start = (currentPage-1)*perPage;
    const slice = data.slice(start, start+perPage);

    const tbody = document.getElementById('empresasTbody');
    if (slice.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="text-center py-5 text-muted">Nenhuma empresa encontrada.</td></tr>`;
    } else {
        tbody.innerHTML = slice.map(e => `
            <tr>
                <td class="px-4">
                    ${e.logo_url
                        ? `<img src="${e.logo_url}" alt="Logo" style="width:40px;height:40px;object-fit:contain;border-radius:6px;border:1px solid #e5e7eb;background:#f9fafb;padding:2px;">`
                        : `<div style="width:40px;height:40px;border-radius:6px;border:1px solid #e5e7eb;background:#f3f4f6;display:flex;align-items:center;justify-content:center;"><i class="bi bi-building text-muted" style="font-size:1.2rem;"></i></div>`
                    }
                </td>
                <td class="px-4 fw-semibold" style="color:#111827;">${e.nome}</td>
                <td class="text-muted">${e.nome_fantasia || '—'}</td>
                <td class="text-muted">${e.cnpj || '—'}</td>
                <td>${e.num_funcionarios}</td>
                <td class="text-end pe-4">
                    <a href="/rh/empresas/${e.id}/editar/" class="btn btn-sm btn-light border me-1" title="Editar">
                        <i class="bi bi-pencil-square text-primary"></i>
                    </a>
                    <button class="btn btn-sm btn-light border" title="Excluir" onclick="openDelete('${e.id}','${escHtml(e.nome)}')">
                        <i class="bi bi-trash3 text-danger"></i>
                    </button>
                </td>
            </tr>
        `).join('');
    }

    // Info
    const info = total === 0 ? '0 resultados'
        : `${start+1} a ${Math.min(start+perPage, total)} de ${total}`;
    document.getElementById('paginacaoInfo').textContent = info;

    // Paginação
    const ul = document.getElementById('paginacaoControles');
    if (pages <= 1) { ul.innerHTML = ''; return; }
    let html = `<li class="page-item ${currentPage===1?'disabled':''}">
        <a class="page-link" href="#" onclick="goPage(${currentPage-1});return false;">‹</a></li>`;
    for (let i = 1; i <= pages; i++) {
        html += `<li class="page-item ${i===currentPage?'active':''}">
            <a class="page-link" href="#" onclick="goPage(${i});return false;">${i}</a></li>`;
    }
    html += `<li class="page-item ${currentPage===pages?'disabled':''}">
        <a class="page-link" href="#" onclick="goPage(${currentPage+1});return false;">›</a></li>`;
    ul.innerHTML = html;
}

function goPage(p) { currentPage = p; render(); }

function openDelete(id, nome) {
    deleteId = id;
    document.getElementById('deleteEmpresaNome').textContent = nome;
    new bootstrap.Modal(document.getElementById('modalDelete')).show();
}

function confirmDelete() {
    if (!deleteId) return;
    fetch(`/api/rh/empresas/${deleteId}/delete/`, {
        method: 'DELETE',
        headers: { 'X-CSRFToken': getCsrf() }
    })
    .then(r => r.json())
    .then(data => {
        bootstrap.Modal.getInstance(document.getElementById('modalDelete')).hide();
        if (data.success) {
            allEmpresas = allEmpresas.filter(e => e.id !== deleteId);
            deleteId = null;
            render();
        } else {
            alert(data.error || 'Erro ao excluir.');
        }
    });
}

function exportCSV() {
    const rows = [['Nome','Nome Fantasia','CNPJ','Nº Funcionários']];
    allEmpresas.forEach(e => rows.push([e.nome, e.nome_fantasia||'', e.cnpj||'', e.num_funcionarios]));
    const csv = rows.map(r => r.join(';')).join('\n');
    const a = document.createElement('a');
    a.href = 'data:text/csv;charset=utf-8,\uFEFF' + encodeURIComponent(csv);
    a.download = 'empresas.csv';
    a.click();
}

function showError(msg) {
    document.getElementById('empresasTbody').innerHTML =
        `<tr><td colspan="5" class="text-center py-5 text-danger">${msg}</td></tr>`;
}

function getCsrf() { return document.cookie.match(/csrftoken=([^;]+)/)?.[1] || ''; }
function escHtml(s) { return (s||'').replace(/'/g, "\\'"); }
</script>
{% endblock %}
